{% extends "base.html" %}

{% block content %}
  <h1>Manufacturer list:</h1>
  {% if manufacturer_list %}
    <ul class="list-unstyled">
      {% for manufacturer in manufacturer_list %}
        <li>{{ manufacturer.name }}</li>
      {% endfor %}
    </ul>
  {% else %}
    <h1>Manufacturers aren't exist.</h1>
  {% endif %}
{% endblock %}
